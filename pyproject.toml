[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ats-scanner"
version = "0.1.0"
description = "Zero-token watchlist job scanner — polls public ATS APIs (Greenhouse, Lever) for new postings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Sandoval" }]
keywords = ["job-search", "ats", "greenhouse", "lever", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-pyyaml",
]

[project.scripts]
ats-scanner = "ats_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
