# The real watchlist. Tracked in git: it is not secret, and it is the most
# valuable curated artifact here — losing it means re-deriving every slug by hand.
# See config/watchlist.example.yaml for the documented schema.
#
# STILL THE TWO-COMPANY SMOKE TEST. Stage 2 seeds the real targets from the
# vault's Company Board Watchlist. The 'plaid' Lever slug below is dead and
# errors every run.
title_filter:
  positive:
    - "data engineer"
    - "data platform"
    - "analytics engineer"
    - "software engineer"
  negative:
    - "intern"
    - "manager"
    - "director"

location_filter:
  always_allow:
    - "Portland"
    - "Oregon"
    - "Remote"
  allow:
    - "Remote"
    - "United States"
    - "USA"
    - "New York"
  block:
    - "India"
    - "United Kingdom"
    - "Germany"

scan_history:
  recheck_after_days: 30

tracked_companies:
  - name: "Care Access"
    careers_url: "https://job-boards.greenhouse.io/careaccess"
  - name: "Plaid"
    careers_url: "https://jobs.lever.co/plaid"
